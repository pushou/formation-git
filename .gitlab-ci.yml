variables:
  TAG_PIPELINE_SELF: "pipeline-${CI_PIPELINE_IID}"
  TAG_PIPELINE_LATEST: "pipeline-latest"

default:
  image: "${CI_REGISTRY_IMAGE}:${TAG_PIPELINE_SELF}"

stages:
  - docker
  - render
  - deploy
  - cleanup

# On autorise les pipeline push et merge request, mais un seul à la fois: en cas
# de merge request locale au dépôt, un seul pipeline est créé
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always

# Template pour la manipulation d'images docker avec crane
.crane:
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  interruptible: false
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY


# === Création d'une image docker temporaire pour ce pipeline ===

build-tmp-docker:
  stage: docker
  image:
      name: gcr.io/kaniko-project/executor:debug
      entrypoint: [""]
  interruptible: false
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --cache \
        --cache-ttl 48h \
        --cleanup \
        --push-retry 1 \
        --use-new-run \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}:${TAG_PIPELINE_SELF}"  \
        --destination "${CI_REGISTRY_IMAGE}:${TAG_PIPELINE_LATEST}"
  # HACK: IN2P3 gitlab seems to have caching issues and report image uploads as
  #       completed when they are actually not yet world-visible. Hack it away.
  after_script: sleep 30


# === Rendu des supports de TP + vérification des sorties git ===

render-and-check:
  stage: render
  interruptible: true
  variables:
    RUST_LOG: info
  script:
    - . "$HOME/.cargo/env"
    - (cd normalize-git-output && cargo install --path .)
    - (cd TP/src && make && mkdir Outputs && mv *.out *.out.norm *.out.diff Outputs)
    - |
      for f in $(ls TP/src/Outputs/*.diff); do
        if [ -s $f ]; then
          echo "Erreur: Les sorties de TP ne correspondent pas aux attentes"
          exit 1;
        fi
      done
    - make
    - mv TP/book public
  artifacts:
    paths:
      - public
      - TP/src/Outputs


# === Publication des énoncés de TP et des images docker (master-only) ===

.deploy:
  stage: deploy
  interruptible: false
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

pages:
  extends: .deploy
  script:
    - echo "Les pages peuvent être consultées sur ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public
  needs:
    - job: render-and-check
      artifacts: true

publish-latest-docker:
  extends:
    - .crane
    - .deploy
  script:
    - crane tag "${CI_REGISTRY_IMAGE}:${TAG_PIPELINE_SELF}" "latest"


# === Suppression de l'image docker temporaire ===

delete-tmp-docker:
  extends: .crane
  stage: cleanup
  when: always
  script:
    - crane delete "${CI_REGISTRY_IMAGE}:${TAG_PIPELINE_SELF}"
