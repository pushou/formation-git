default:
  image: "${CI_REGISTRY_IMAGE}"

stages:
  - docker
  - render
  - deploy

Image docker:
  stage: docker
  image:
      name: gcr.io/kaniko-project/executor:debug
      entrypoint: [""]
  interruptible: false
  script:
    - mkdir -p /kaniko/.docker
    - |
      auth_config() {
        REGISTRY_URL="$1"
        REGISTRY_USER="$2"
        REGISTRY_PWD="$3"
        AUTH_STR=$( printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PWD}" \
                    | base64 \
                    | tr -d '\n' )
        printf '"%s": { "auth": "%s" }' "${REGISTRY_URL}" "${AUTH_STR}"
      }
      REGISTRY_CONFIG="$(auth_config ${CI_REGISTRY} ${CI_REGISTRY_USER} ${CI_REGISTRY_PASSWORD})"
      printf '{ "auths": { %s } }' \
             "${REGISTRY_CONFIG}" \
             >/kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --cache \
        --cache-ttl 48h \
        --cleanup \
        --push-retry 1 \
        --use-new-run \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}"
  # HACK: IN2P3 gitlab seems to have caching issues and report image uploads as
  #       completed when they are actually not yet world-visible. Hack it away.
  after_script: sleep 30
  rules:
   - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

Rendu supports:
  stage: render
  interruptible: true
  script:
    - make
    - mv TP/book public
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  interruptible: false
  script:
    - echo "Pages will be served at ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public
  needs:
    - job: Rendu supports
      artifacts: true
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
